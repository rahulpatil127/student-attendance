components:
  schemas:
    AcademicYear:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: e.g. 2025-26
          maxLength: 64
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_active:
          type: boolean
      required:
      - end_date
      - id
      - name
      - start_date
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        password:
          type: string
          writeOnly: true
          minLength: 8
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - id
      - username
    AttendanceRecord:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        session:
          type: integer
        student:
          type: integer
        student_username:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/AttendanceRecordStatusEnum'
        marked_by:
          type: integer
          readOnly: true
          nullable: true
        note:
          type: string
          maxLength: 255
      required:
      - id
      - marked_by
      - session
      - status
      - student
      - student_username
    AttendanceRecordStatusEnum:
      enum:
      - PRESENT
      - ABSENT
      - LATE
      - EXCUSED
      type: string
      description: |-
        * `PRESENT` - Present
        * `ABSENT` - Absent
        * `LATE` - Late
        * `EXCUSED` - Excused
    AttendanceSession:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        classroom:
          type: integer
        classroom_display:
          type: string
          readOnly: true
        subject:
          type: integer
        subject_display:
          type: string
          readOnly: true
        date:
          type: string
          format: date
        created_by:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AttendanceSessionStatusEnum'
          readOnly: true
        records:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRecord'
          readOnly: true
        counts:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - classroom
      - classroom_display
      - counts
      - created_at
      - created_by
      - id
      - records
      - status
      - subject
      - subject_display
      - updated_at
    AttendanceSessionStatusEnum:
      enum:
      - DRAFT
      - SUBMITTED
      - LOCKED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `SUBMITTED` - Submitted
        * `LOCKED` - Locked
    Classroom:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Grade / class name, e.g. Grade 10
          maxLength: 64
        section:
          type: string
          default: A
          maxLength: 16
        academic_year:
          type: integer
        academic_year_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
      required:
      - academic_year
      - academic_year_name
      - id
      - name
    Enrollment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
        student_username:
          type: string
          readOnly: true
        classroom:
          type: integer
        classroom_display:
          type: string
          readOnly: true
        academic_year:
          type: integer
        status:
          $ref: '#/components/schemas/Status89bEnum'
        enrolled_on:
          type: string
          format: date
          readOnly: true
      required:
      - academic_year
      - classroom
      - classroom_display
      - enrolled_on
      - id
      - student
      - student_username
    Login:
