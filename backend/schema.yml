      operationId: academic_years_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - academic-years
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAcademicYearList'
          description: ''
    post:
      operationId: academic_years_create
      tags:
      - academic-years
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicYear'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcademicYear'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcademicYear'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYear'
          description: ''
